<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAMIINGO — Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="announcement">
    <button class="announcement-arrow" aria-label="Previous announcement">←</button>
    <p>MIINGO HOODIE COMING SOON <a href="#shop">PRE ORDER</a></p>
    <button class="announcement-arrow" aria-label="Next announcement">→</button>
  </div>

  <header class="site-header">
    <a class="logo" href="#top" aria-label="FLAMIINGO home">
      <img src="assets/Black.png.png" alt="FLAMIINGO logo"></img>
    </a>

    <nav class="desktop-nav">
      <a href="#featured">FEATURED</a>
      <a href="#new">NEW ARRIVALS</a>
      <a href="#shop">SHOP</a>
      <a href="#sale">SALE</a>
      <a href="#rewards">REWARDS</a>
    </nav>

    <div class="header-actions">
      <button class="icon-button" id="searchButton" aria-label="Search">🦩</button>
      <button class="icon-button" id="menuButton" aria-label="Menu">☰</button>
      <button class="icon-button" id="cartButton">BAG <span id="cartCount">0</span></button>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="featured">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="assets/apparel_video_1769585573064.mp4" type="video/mp4">
      </video>

      <div class="hero-overlay"></div>

      <div class="hero-copy">
        <p class="eyebrow">MIINGO HOODIE</p>
        <h1>COMING<br>SOON</h1>
        <a class="button button-light" href="#shop">PRE ORDER</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-logo">FLAMIINGO<span> ®</span></div>

    <div>
      <h3>SHOP</h3>
      <a href="#shop">New</a>
    </div>

    <div>
      <h3>HELP</h3>
      <a href="#">Contact</a>
      <a href="#">Track Order</a>
      <a href="#">Returns</a>
    </div>

    <div>
      <h3>FOLLOW</h3>
      <a href="https://www.instagram.com/theflamiingokid/" target="_blank">Instagram</a>
      <a href="https://miingo954.github.io/theflamiingokid/" target="_blank">THEFLAMIINGOKID.COM</a>
    </div>

    <small>© 2026 FLAMIINGO. ALL RIGHTS RESERVED.</small>
  </footer>

  <script>
    document.querySelector("#searchButton").addEventListener("click", () => {
      document.querySelector("#shop").scrollIntoView({ behavior: "smooth" });
    });

    document.querySelector("#menuButton").addEventListener("click", () => {
      alert("Your menu can go here.");
    });

    document.querySelector("#cartButton").addEventListener("click", () => {
      alert("Your bag is empty.");
    });
  </script>
</body>
</html>
